[env:pocket]
; 공통 설정. 단독으로 빌드하면 F1(부팅 로그).
build_src_filter = -<*> +<pins.h> +<stages/f1/>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; 블루투스+오디오+화면은 기본 용량을 넘음
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D USER_SETUP_LOADED=1                ; TFT_eSPI 설정을 여기서
  -D ILI9341_DRIVER=1
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=27
  -D TFT_DC=13
  -D TFT_RST=14
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=27000000
lib_deps =
  bodmer/TFT_eSPI
  https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
  https://github.com/pschatzmann/arduino-audio-tools.git
  https://github.com/pschatzmann/arduino-libhelix.git
  https://github.com/pschatzmann/ESP32-A2DP.git
  madhephaestus/ESP32Encoder

; 단계별 스케치: src/stages/<이름>/ 하나만 빌드. 사용법은 CLAUDE.md 참고.
[env:f1]
extends = env:pocket
build_src_filter = -<*> +<pins.h> +<stages/f1/>

[env:f2]
extends = env:pocket
build_src_filter = -<*> +<pins.h> +<stages/f2/>

; S2 레일 확인용 (멀티미터 대신 ESP32 ADC). 32번은 GND 레일에 연결되므로 OUTPUT 금지.
[env:railcheck]
extends = env:pocket
build_src_filter = -<*> +<pins.h> +<stages/railcheck/>
